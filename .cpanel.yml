---
deployment:
  tasks:
    # Exact Document Root identified from cPanel File Manager
    - export DEPLOYPATH=/home4/hatkev6t/social.meradomain.in
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R cpanel-web/* $DEPLOYPATH/
    - /bin/cp cpanel-web/.htaccess $DEPLOYPATH/ 2>/dev/null || true
    - /bin/rm -f $DEPLOYPATH/index.html
    - /bin/chmod -R 755 $DEPLOYPATH
